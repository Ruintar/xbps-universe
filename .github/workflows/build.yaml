name: Build Packages

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild all packages, ignoring what is already published"
        type: boolean
        default: false
  schedule:
    - cron: "0 */8 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    outputs:
      skip_x86_64: ${{ steps.check.outputs.skip_x86_64 }}
      skip_aarch64: ${{ steps.check.outputs.skip_aarch64 }}
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev
    env:
      ARCH: ${{ matrix.arch }}
      BOOTSTRAP: ${{ matrix.arch }}
      REPO: ${{ github.repository }}
      FORCE_REBUILD: ${{ github.event.inputs.force_rebuild == 'true' && '1' || '0' }}
    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash curl git github-cli
          useradd -G xbuilder -M builder

      - name: Prepare state directory
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          echo "XBPS_STATE_DIR=$RUNNER_TEMP/xbps-state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xbps-state"
          chmod 0777 "$RUNNER_TEMP/xbps-state"
          echo "state directory: $RUNNER_TEMP/xbps-state (0777, no sticky bit)"
          echo "kernel fs.protected_regular=$(cat /proc/sys/fs/protected_regular 2>/dev/null || echo unavailable)"

      - name: Clone void-packages
        run: git clone --depth=1 --branch=master https://github.com/void-linux/void-packages

      - name: Clone xbps-universe
        run: git clone --depth=1 --branch=master "https://github.com/${REPO}" xbps-universe

      - name: Populate srcpkgs
        run: |
          chmod +x xbps-universe/populate-srcpkgs.sh
          VOID_PACKAGES_DIR="void-packages" ./xbps-universe/populate-srcpkgs.sh
          if ls xbps-universe/common/repo-keys/*.plist >/dev/null 2>&1; then
            cp xbps-universe/common/repo-keys/*.plist void-packages/common/repo-keys/
            mkdir -p /var/db/xbps/keys
            cp xbps-universe/common/repo-keys/*.plist /var/db/xbps/keys/
            echo "xbps-universe public keys imported to the host and the masterdir"
          else
            echo "warning: no plist files in xbps-universe/common/repo-keys, the repository will be left without a trusted key on the host"
          fi

      - name: Prepare masterdir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd void-packages
          if gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            sed -i "1i repository=https://github.com/${REPO}/releases/latest/download" etc/xbps.d/repos-remote.conf
          else
            echo "release latest does not exist yet, continuing without the extra repository"
          fi
          chown -R builder:builder .
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh

      - name: Check for changed packages
        run: |
          chmod +x xbps-universe/changed-packages.sh
          cd void-packages
          sudo -Eu builder env XBPS_STATE_DIR="${XBPS_STATE_DIR}" VOID_PACKAGES_DIR="." ARCH="${ARCH}" FORCE_REBUILD="${FORCE_REBUILD}" \
            bash ../xbps-universe/changed-packages.sh \
            "https://github.com/${REPO}/releases/latest/download"

      - name: Purge release packages no longer in the pipeline (force rebuild only)
        if: env.FORCE_REBUILD == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s ${XBPS_STATE_DIR}/new_pkgs ]; then
            echo "error: ${XBPS_STATE_DIR}/new_pkgs is empty, aborting the purge as a safety measure"
            exit 1
          fi
          if ! gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            echo "release latest does not exist yet, nothing to purge"
            exit 0
          fi
          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
            > ${XBPS_STATE_DIR}/assets-now.txt

          # Packages known to the pipeline for this arch.
          # With force rebuild enabled, new_pkgs contains all of them.
          sed 's/-[^-]*$//' ${XBPS_STATE_DIR}/new_pkgs | sort -u > ${XBPS_STATE_DIR}/known-pkgs.txt

          # Orphans: published assets for this arch whose package
          # is no longer tracked by the pipeline.
          : > ${XBPS_STATE_DIR}/orphan-pkgs.txt
          for name in $(grep -E "\.${ARCH}\.xbps(\.sig2)?$" ${XBPS_STATE_DIR}/assets-now.txt); do
            pkg=$(echo "$name" | sed -E "s/\.${ARCH}\.xbps(\.sig2)?$//" | sed 's/-[^-]*$//')
            if ! grep -qx "$pkg" ${XBPS_STATE_DIR}/known-pkgs.txt; then
              grep -qx "$pkg" ${XBPS_STATE_DIR}/orphan-pkgs.txt || echo "$pkg" >> ${XBPS_STATE_DIR}/orphan-pkgs.txt
            fi
          done

          if [ ! -s ${XBPS_STATE_DIR}/orphan-pkgs.txt ]; then
            echo "purge ok (${ARCH}): no orphaned packages in the release"
            exit 0
          fi

          echo "purge (${ARCH}): packages in the release no longer tracked by the pipeline:"
          cat ${XBPS_STATE_DIR}/orphan-pkgs.txt
          for pkg in $(cat ${XBPS_STATE_DIR}/orphan-pkgs.txt); do
            for name in $(grep -E "^${pkg}-[0-9].*\.${ARCH}\.xbps(\.sig2)?$" ${XBPS_STATE_DIR}/assets-now.txt); do
              echo "deleting orphaned asset: ${name}"
              gh release delete-asset latest "${name}" --repo "${REPO}" --yes || true
            done
          done
          echo "purge complete (${ARCH}); repodata will be regenerated without these packages"

      - name: Reconcile pending packages with real release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
            > ${XBPS_STATE_DIR}/release-assets.txt 2>/dev/null || : > ${XBPS_STATE_DIR}/release-assets.txt

          : > ${XBPS_STATE_DIR}/ghost-pkgs.txt
          while read -r line; do
            if [ -z "$line" ]; then continue; fi
            pkg=$(echo "$line" | sed 's/-[^-]*$//')
            ver=$(echo "$line" | sed "s/^${pkg}-//")
            if ! grep -Fxq "${pkg}-${ver}.${ARCH}.xbps" ${XBPS_STATE_DIR}/release-assets.txt \
               || ! grep -Fxq "${pkg}-${ver}.${ARCH}.xbps.sig2" ${XBPS_STATE_DIR}/release-assets.txt; then
              echo "${pkg}: version ${ver} does not exist as a real ${ARCH} asset in the release, forcing rebuild"
              echo "$pkg" >> ${XBPS_STATE_DIR}/ghost-pkgs.txt
            fi
          done < ${XBPS_STATE_DIR}/new_pkgs

          if [ -s ${XBPS_STATE_DIR}/ghost-pkgs.txt ]; then
            # Rebuild the queue as a fresh root-owned file instead of appending
            # in place: the swap is an atomic rename inside the state directory
            # and the queue ends the step with a single consistent owner, no
            # matter which user produced the previous file.
            { grep -vxF -f ${XBPS_STATE_DIR}/ghost-pkgs.txt ${XBPS_STATE_DIR}/pkgs-to-build.txt || true
              cat ${XBPS_STATE_DIR}/ghost-pkgs.txt
            } > ${XBPS_STATE_DIR}/queue-merged.txt
            rm -f ${XBPS_STATE_DIR}/pkgs-to-build.txt
            mv ${XBPS_STATE_DIR}/queue-merged.txt ${XBPS_STATE_DIR}/pkgs-to-build.txt
            echo "packages added by reconciliation (${ARCH}):"
            cat ${XBPS_STATE_DIR}/ghost-pkgs.txt
          else
            echo "reconciliation ok (${ARCH}): every template has a matching real asset"
          fi
          echo "final build queue (${ARCH}):"
          cat ${XBPS_STATE_DIR}/pkgs-to-build.txt

      - name: Check for pending work
        id: check
        run: |
          : > ${XBPS_STATE_DIR}/failed-pkgs.txt
          if [ -s ${XBPS_STATE_DIR}/pkgs-to-build.txt ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "skip_${ARCH}=false" >> "$GITHUB_OUTPUT"
            echo "there are packages to build in this run (${ARCH}), full pipeline"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_${ARCH}=true" >> "$GITHUB_OUTPUT"
            echo "nothing to build in this run (${ARCH}), lightweight mode (skip)"
          fi

      - name: Build changed packages
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/packages ~/hostdir
          chown -R builder:builder ~/packages ~/hostdir
          cd void-packages
          if [ -s ${XBPS_STATE_DIR}/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if sudo -Eu builder ./xbps-src -j"$(nproc)" -s -H ~/hostdir pkg "$pkg"; then
                n=$(find ~/hostdir/binpkgs -name "${pkg}-[0-9]*.${ARCH}.xbps" | wc -l)
                if [ "$n" -eq 0 ]; then
                  echo "no ${ARCH} binary found for ${pkg} after the build"
                  echo "$pkg" >> ${XBPS_STATE_DIR}/failed-pkgs.txt
                else
                  find ~/hostdir/binpkgs -name "${pkg}-[0-9]*.${ARCH}.xbps" -exec cp {} ~/packages/ \;
                fi
              else
                echo "build failed: ${pkg}"
                echo "$pkg" >> ${XBPS_STATE_DIR}/failed-pkgs.txt
              fi
            done < ${XBPS_STATE_DIR}/pkgs-to-build.txt
          else
            echo "no packages to build in this run"
          fi
          echo "packages built: $(ls -1 ~/packages/*.${ARCH}.xbps 2>/dev/null | wc -l)"
          echo "failed packages: $(wc -l < ${XBPS_STATE_DIR}/failed-pkgs.txt)"

      - name: Download currently published packages
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/all_packages
          if ! gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            echo "release latest does not exist yet, nothing to download"
            exit 0
          fi
          n=$(gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
            | grep -cE "\.${ARCH}\.xbps$" || true)
          if [ "$n" -eq 0 ]; then
            echo "no ${ARCH} assets published yet"
            exit 0
          fi
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -rf ~/all_packages
            mkdir -p ~/all_packages
            if gh release download latest --repo "${REPO}" --dir ~/all_packages \
              --pattern "*.${ARCH}.xbps" --clobber; then
              ok=1
              break
            fi
            echo "download attempt ${attempt} failed, waiting before the next attempt"
            sleep $((attempt * 15))
          done
          if [ "$ok" -ne 1 ]; then
            echo "failed to download the published assets after 5 attempts"
            exit 1
          fi
          echo "downloaded ${ARCH} assets: $(ls -1 ~/all_packages | wc -l)"

      - name: Merge old and new packages
        if: steps.check.outputs.skip != 'true'
        run: |
          rm -f ~/all_packages/*.sig2
          if [ -s ${XBPS_STATE_DIR}/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if grep -qx "$pkg" ${XBPS_STATE_DIR}/failed-pkgs.txt; then
                echo "keeping the old assets for ${pkg} (build failed)"
                continue
              fi
              rm -f ~/all_packages/"${pkg}"-[0-9]*."${ARCH}".xbps
            done < ${XBPS_STATE_DIR}/pkgs-to-build.txt
          fi
          cp ~/all_packages/*."${ARCH}".xbps ~/packages/ 2>/dev/null || true
          echo "total ${ARCH} packages to index: $(ls -1 ~/packages/*."${ARCH}".xbps | wc -l)"

      - name: Regenerate index and sign
        if: steps.check.outputs.skip != 'true'
        env:
          PRIVATE_PEM: ${{ secrets.PRIVATE_PEM }}
          XBPS_PASSPHRASE: ${{ secrets.PRIVATE_PEM_PASSPHRASE }}
        run: |
          if [ -z "${PRIVATE_PEM}" ]; then
            echo "secret PRIVATE_PEM is empty or missing"
            exit 1
          fi
          cd ~/packages
          xbps-rindex -a *."${ARCH}".xbps
          temp_key=$(mktemp "${XBPS_STATE_DIR}/privkey-XXXXXX")
          printf '%s\n' "$PRIVATE_PEM" > "$temp_key"
          chmod 600 "$temp_key"
          xbps-rindex --privkey "$temp_key" --sign --signedby "Ruintar (xbps-universe CI)" .
          xbps-rindex --privkey "$temp_key" --sign-pkg *."${ARCH}".xbps
          rm -f "$temp_key"

      - name: Prepare release assets and pre-flight validation
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/release
          cp ~/packages/"${ARCH}"-repodata ~/release/
          if [ -s ${XBPS_STATE_DIR}/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if grep -qx "$pkg" ${XBPS_STATE_DIR}/failed-pkgs.txt; then continue; fi
              if ! ls ~/packages/"${pkg}"-[0-9]*."${ARCH}".xbps >/dev/null 2>&1; then
                echo "${pkg} (${ARCH}) binary missing after the build, marking it as FAIL to protect the published asset"
                echo "$pkg" >> ${XBPS_STATE_DIR}/failed-pkgs.txt
                continue
              fi
              cp ~/packages/"${pkg}"-[0-9]*."${ARCH}".xbps ~/release/
              cp ~/packages/"${pkg}"-[0-9]*."${ARCH}".xbps.sig2 ~/release/ 2>/dev/null || true
            done < ${XBPS_STATE_DIR}/pkgs-to-build.txt
          fi

          (cd ~/release && ls -1) > ${XBPS_STATE_DIR}/new-assets.txt
          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
            > ${XBPS_STATE_DIR}/current-assets.txt 2>/dev/null || : > ${XBPS_STATE_DIR}/current-assets.txt
          cp ${XBPS_STATE_DIR}/current-assets.txt ${XBPS_STATE_DIR}/simulated-assets.txt

          if [ -s ${XBPS_STATE_DIR}/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if grep -qx "$pkg" ${XBPS_STATE_DIR}/failed-pkgs.txt; then continue; fi
              grep -vE "^${pkg}-[0-9].*\.${ARCH}\.xbps(\.sig2)?$" ${XBPS_STATE_DIR}/simulated-assets.txt \
                > ${XBPS_STATE_DIR}/sim-tmp && mv ${XBPS_STATE_DIR}/sim-tmp ${XBPS_STATE_DIR}/simulated-assets.txt
            done < ${XBPS_STATE_DIR}/pkgs-to-build.txt
          fi
          cat ${XBPS_STATE_DIR}/new-assets.txt >> ${XBPS_STATE_DIR}/simulated-assets.txt

          sed 's/-[^-]*$//' ${XBPS_STATE_DIR}/new_pkgs | sort -u > ${XBPS_STATE_DIR}/pkg-list.txt
          rc=0
          while read -r pkg; do
            if [ -z "$pkg" ]; then continue; fi
            count=$(grep -cE "^${pkg}-[0-9].*\.${ARCH}\.xbps$" ${XBPS_STATE_DIR}/simulated-assets.txt || true)
            if [ "$count" -gt 1 ]; then
              echo "a duplicate would be created for ${pkg} (${ARCH}):"
              grep -E "^${pkg}-[0-9].*\.${ARCH}\.xbps$" ${XBPS_STATE_DIR}/simulated-assets.txt
              rc=1
            fi
          done < ${XBPS_STATE_DIR}/pkg-list.txt
          if [ "$rc" -ne 0 ]; then
            echo "pre-flight aborted: the release would end up with more than one version of the same package/architecture"
            exit 1
          fi
          echo "pre-flight ok (${ARCH}): no duplicates predicted"

      - name: Delete stale release assets
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            echo "release latest does not exist yet, nothing to remove"
            exit 0
          fi
          if [ -s ${XBPS_STATE_DIR}/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if grep -qx "$pkg" ${XBPS_STATE_DIR}/failed-pkgs.txt; then continue; fi
              for name in $(gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
                  | grep -E "^${pkg}-[0-9].*\.${ARCH}\.xbps(\.sig2)?$" \
                  | grep -vxF -f ${XBPS_STATE_DIR}/new-assets.txt); do
                echo "deleting stale asset: ${name}"
                gh release delete-asset latest "$name" --repo "${REPO}" --yes || true
              done
            done < ${XBPS_STATE_DIR}/pkgs-to-build.txt
          fi
          gh release delete-asset latest "${ARCH}-repodata" --repo "${REPO}" --yes || true

      - name: Generate build manifest
        run: |
          : > ~/manifest-"${ARCH}".txt
          while read -r line; do
            if [ -z "$line" ]; then continue; fi
            pkg=$(echo "$line" | sed 's/-[^-]*$//')
            ver=$(echo "$line" | sed "s/^${pkg}-//")
            if grep -qx "$pkg" ${XBPS_STATE_DIR}/failed-pkgs.txt; then
              status=FAIL
            else
              status=OK
            fi
            echo "$pkg $ver $status" >> ~/manifest-"${ARCH}".txt
          done < ${XBPS_STATE_DIR}/new_pkgs
          cat ~/manifest-"${ARCH}".txt

      - name: Upload built packages
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: built-packages-${{ matrix.arch }}
          path: ~/release/
          retention-days: 1

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.arch }}
          path: ~/manifest-${{ matrix.arch }}.txt
          retention-days: 1

  create-github-release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout xbps-universe
        uses: actions/checkout@v7

      - name: Prepare state directory
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          echo "XBPS_STATE_DIR=$RUNNER_TEMP/xbps-state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xbps-state"

      - name: Evaluate publish mode
        id: mode
        env:
          SKIP_X86_64: ${{ needs.build.outputs.skip_x86_64 }}
          SKIP_AARCH64: ${{ needs.build.outputs.skip_aarch64 }}
        run: |
          if [ "${SKIP_X86_64}" = "true" ] && [ "${SKIP_AARCH64}" = "true" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "lightweight mode: nothing to publish in this run"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "full mode: there is work to publish"
          fi

      - name: Download built packages
        if: steps.mode.outputs.full == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: built-packages-*
          path: release
          merge-multiple: true

      - name: Download manifests
        uses: actions/download-artifact@v7
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true

      - name: Timestamp
        if: steps.mode.outputs.full == 'true'
        id: ts
        run: echo "value=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        if: steps.mode.outputs.full == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Latest build of XBPS packages
          Built on: ${{ steps.ts.outputs.value }}"
          if gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit latest --repo "${REPO}" --title "Latest Build" --notes "$notes"
          else
            gh release create latest --repo "${REPO}" --title "Latest Build" --notes "$notes" --latest
          fi

      - name: Upload release assets
        if: steps.mode.outputs.full == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no assets to publish"
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload latest "$f" --repo "${REPO}" --clobber; then
                ok=1
                break
              fi
              echo "upload failed for ${name} (attempt ${attempt}), waiting before the next attempt"
              sleep $((attempt * 15))
            done
            if [ "$ok" -ne 1 ]; then
              echo "permanent upload failure for ${name}"
              exit 1
            fi
            echo "asset published: ${name}"
          done

      - name: Verify release (post-flight)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls manifests/manifest-*.txt >/dev/null 2>&1 || {
            echo "error: no manifest found, unable to verify the release"
            exit 1
          }
          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' | sort > ${XBPS_STATE_DIR}/assets.txt
          if [ ! -s ${XBPS_STATE_DIR}/assets.txt ]; then
            echo "error: asset list is empty"
            exit 1
          fi
          rc=0
          for arch in x86_64 aarch64; do
            cut -d' ' -f1 "manifests/manifest-${arch}.txt" | sort -u > "${XBPS_STATE_DIR}/pkg-list-${arch}.txt"
            if [ ! -s "${XBPS_STATE_DIR}/pkg-list-${arch}.txt" ]; then
              echo "error: package list for ${arch} is empty, refusing to run an empty verification"
              exit 1
            fi
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              count=$(grep -cE "^${pkg}-[0-9].*\.${arch}\.xbps$" ${XBPS_STATE_DIR}/assets.txt || true)
              sigcount=$(grep -cE "^${pkg}-[0-9].*\.${arch}\.xbps\.sig2$" ${XBPS_STATE_DIR}/assets.txt || true)
              if [ "$count" -gt 1 ]; then
                echo "more than one version of ${pkg} (${arch}) coexisting in the release:"
                grep -E "^${pkg}-[0-9].*\.${arch}\.xbps$" ${XBPS_STATE_DIR}/assets.txt
                rc=1
              elif [ "$count" -eq 0 ]; then
                if grep -h "^${pkg} " "manifests/manifest-${arch}.txt" | grep -q FAIL; then
                  echo "warning: ${pkg} (${arch}) missing, the build failed in this run"
                else
                  echo "error: ${pkg} (${arch}) is missing from the release"
                  rc=1
                fi
              fi
              if [ "$sigcount" -ne "$count" ]; then
                echo "error: signature mismatch for ${pkg} (${arch}): ${sigcount} sig2 files for ${count} packages"
                rc=1
              fi
            done < "${XBPS_STATE_DIR}/pkg-list-${arch}.txt"
          done
          for arch in x86_64 aarch64; do
            if ! grep -qx "${arch}-repodata" ${XBPS_STATE_DIR}/assets.txt; then
              echo "error: ${arch}-repodata is missing from the release"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "post-flight failed: the release is in an inconsistent state"
            exit 1
          fi
          echo "post-flight ok: one version per package/architecture, signatures and repodata present"

      - name: Generate PACKAGES.md
        run: |
          ls manifests/manifest-*.txt >/dev/null 2>&1 || {
            echo "error: no manifest found in manifests/"
            exit 1
          }
          cut -d' ' -f1 manifests/manifest-*.txt | sort -u > ${XBPS_STATE_DIR}/pkg-order.txt
          if [ ! -s ${XBPS_STATE_DIR}/pkg-order.txt ]; then
            echo "error: package list is empty, refusing to generate an empty PACKAGES.md"
            exit 1
          fi
          {
            echo "| Package | aarch64 | x86_64 |"
            echo "|---|---|---|"
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              cell_aarch64="-"
              if grep -q "^${pkg} " manifests/manifest-aarch64.txt 2>/dev/null; then
                ver=$(grep "^${pkg} " manifests/manifest-aarch64.txt | head -n1 | awk '{ print $2 }')
                if grep "^${pkg} " manifests/manifest-aarch64.txt | awk '{ print $3 }' | grep -qx FAIL; then
                  cell_aarch64="❌ ${ver}"
                else
                  cell_aarch64="✅ ${ver}"
                fi
              fi
              cell_x86_64="-"
              if grep -q "^${pkg} " manifests/manifest-x86_64.txt 2>/dev/null; then
                ver=$(grep "^${pkg} " manifests/manifest-x86_64.txt | head -n1 | awk '{ print $2 }')
                if grep "^${pkg} " manifests/manifest-x86_64.txt | awk '{ print $3 }' | grep -qx FAIL; then
                  cell_x86_64="❌ ${ver}"
                else
                  cell_x86_64="✅ ${ver}"
                fi
              fi
              echo "| ${pkg} | ${cell_aarch64} | ${cell_x86_64} |"
            done < ${XBPS_STATE_DIR}/pkg-order.txt
          } > PACKAGES.md
          cat PACKAGES.md

      - name: Commit PACKAGES.md
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update PACKAGES.md"
          file_pattern: PACKAGES.md