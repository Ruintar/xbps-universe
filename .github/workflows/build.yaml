name: Build Packages

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Ignorar o que já está publicado e reconstruir todos os pacotes (limpa duplicatas acumuladas)
        type: boolean
        default: false
  schedule:
    - cron: '30 6,18 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: ${{ matrix.arch }}
        BOOTSTRAP: ${{ matrix.arch }}

    env:
      REPO: ${{ github.repository }}

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash curl git github-cli
          useradd -G xbuilder -M builder

      - name: Clone void-packages
        run: git clone --depth=1 --branch=master https://github.com/void-linux/void-packages

      - name: Clone xbps-universe
        run: git clone --depth=1 --branch=master "https://github.com/${REPO}" xbps-universe

      - name: Populate srcpkgs
        run: |
          chmod +x xbps-universe/populate-srcpkgs.sh
          VOID_PACKAGES_DIR="void-packages" ./xbps-universe/populate-srcpkgs.sh

      - name: Prepare masterdir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd void-packages
          if gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            sed -i "1i repository=https://github.com/${REPO}/releases/latest/download" \
              etc/xbps.d/repos-remote.conf
          fi
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          sudo -Eu builder common/travis/prepare.sh &&
          common/travis/fetch-xtools.sh

      - name: Check for changed packages
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          chmod +x xbps-universe/changed-packages.sh
          cd void-packages
          export VOID_PACKAGES_DIR="."
          sudo -Eu builder bash ../xbps-universe/changed-packages.sh \
            "https://github.com/${REPO}/releases/latest/download"

      - name: Build changed packages
        run: |
          mkdir -p ~/packages ~/hostdir
          chown -R builder:builder ~/packages
          chown -R builder:builder ~/hostdir

          cd void-packages
          : > /tmp/failed-pkgs.txt
          if [ -s /tmp/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if sudo -Eu builder ./xbps-src -j"$(nproc)" -s -H ~/hostdir pkg "$pkg"; then
                find ~/hostdir/binpkgs -name "${pkg}-[0-9]*.xbps" -exec cp {} ~/packages/ \;
              else
                echo "$pkg" >> /tmp/failed-pkgs.txt
              fi
            done < /tmp/pkgs-to-build.txt
          else
            echo "Nada para buildar, todos os pacotes já estão atualizados."
          fi

      - name: Download the rest of the packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/all_packages
          if gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            attempt=1
            until gh release download latest --repo "${REPO}" --dir ~/all_packages --clobber; do
              if [ "$attempt" -ge 5 ]; then
                echo "Falha ao baixar os pacotes já publicados depois de 5 tentativas" >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 15))
            done
          else
            echo "Nenhuma release existente ainda — nada para baixar."
          fi

      - name: Merge packages
        run: |
          rm -f ~/all_packages/*.sig2 2>/dev/null || true
          if [ -s /tmp/pkgs-to-build.txt ]; then
            while read -r pkg; do
              rm -f ~/all_packages/"${pkg}"-[0-9]*."${ARCH}".xbps
            done < /tmp/pkgs-to-build.txt
          fi
          mkdir -p ~/new_packages
          cp ~/packages/*.xbps ~/new_packages/ 2>/dev/null || true
          cp ~/all_packages/*.xbps ~/packages/ 2>/dev/null || true

      - name: Sign and package
        env:
          PRIVATE_PEM: ${{ secrets.PRIVATE_PEM }}
          XBPS_PASSPHRASE: ${{ secrets.PRIVATE_PEM_PASSPHRASE }}
        run: |
          cd ~/packages
          xbps-rindex -a *.xbps
          if [ -z "$PRIVATE_PEM" ]; then
            echo "PRIVATE_PEM secret está vazio ou não configurado." >&2
            exit 1
          fi
          temp_key=$(mktemp)
          printf '%s\n' "$PRIVATE_PEM" > "$temp_key"
          chmod 600 "$temp_key"
          xbps-rindex --privkey "$temp_key" --sign --signedby "Ruintar (xbps-universe CI)" ~/packages
          xbps-rindex --privkey "$temp_key" --sign-pkg ~/packages/*.xbps
          rm -f "$temp_key"

      - name: Prepare release files
        run: |
          mkdir -p ~/release
          cp ~/packages/"${ARCH}"-repodata ~/release/
          if [ -s /tmp/pkgs-to-build.txt ]; then
            cp ~/new_packages/* ~/release/ 2>/dev/null || true
            for pkg in $(basename -s .xbps ~/new_packages/*.xbps 2>/dev/null); do
              cp ~/packages/"$pkg".xbps.sig2 ~/release/ 2>/dev/null || true
            done
          fi

      - name: Generate build manifest
        run: |
          : > ~/manifest-"${ARCH}".txt
          while read -r line; do
            pkg=$(echo "$line" | sed -E 's/-[0-9].*$//')
            ver="${line#${pkg}-}"
            if grep -qx "$pkg" /tmp/failed-pkgs.txt 2>/dev/null; then
              status="FAIL"
            else
              status="OK"
            fi
            echo "${pkg} ${ver} ${status}" >> ~/manifest-"${ARCH}".txt
          done < /tmp/new_pkgs

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: built-packages-${{ matrix.arch }}
          path: ~/release/
          retention-days: 1

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.arch }}
          path: ~/manifest-${{ matrix.arch }}.txt
          retention-days: 1

  create-github-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: built-packages-*
          path: ~/release/
          merge-multiple: true

      - name: Download build manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: ~/manifests/
          merge-multiple: true

      - name: Generate PACKAGES.md
        run: |
          cat ~/manifests/manifest-*.txt | awk '
            {
              pkg=$1; ver=$2; st=$3
              if (!(pkg in version)) version[pkg]=ver
              if (st == "FAIL") worst[pkg]="FAIL"
              else if (!(pkg in worst)) worst[pkg]="OK"
            }
            END {
              for (p in worst) print p
            }' | sort > /tmp/pkg-order.txt

          {
            echo "| Package | Version | Status |"
            echo "|---|---|---|"
            while read -r pkg; do
              ver=$(grep -h "^${pkg} " ~/manifests/manifest-*.txt | head -n1 | awk '{ print $2 }')
              if grep -h "^${pkg} " ~/manifests/manifest-*.txt | awk '{ print $3 }' | grep -qx "FAIL"; then
                icon="❌"
              else
                icon="✅"
              fi
              echo "| ${pkg} | ${ver} | ${icon} |"
            done < /tmp/pkg-order.txt
          } > PACKAGES.md

      - name: Set build timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Simulate final state and abort on conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGES="brave brave-beta brave-nightly brave-origin brave-origin-beta brave-origin-nightly vivaldi vivaldi-snapshot"
          ARCHES="x86_64 aarch64"

          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' 2>/dev/null > /tmp/live-assets.txt || : > /tmp/live-assets.txt

          : > /tmp/stale-assets.txt
          for arch in $ARCHES; do
            [ -f ~/manifests/manifest-"${arch}".txt ] || continue
            while read -r pkg ver status; do
              grep -E "^${pkg}-[0-9].*\.${arch}\.xbps(\.sig2)?$" /tmp/live-assets.txt | while read -r asset; do
                case "$asset" in
                  "${pkg}-${ver}.${arch}.xbps"|"${pkg}-${ver}.${arch}.xbps.sig2") ;;
                  *) echo "$asset" >> /tmp/stale-assets.txt ;;
                esac
              done
            done < ~/manifests/manifest-"${arch}".txt
          done

          grep -vxFf /tmp/stale-assets.txt /tmp/live-assets.txt > /tmp/simulated-assets.txt 2>/dev/null || cp /tmp/live-assets.txt /tmp/simulated-assets.txt
          for f in ~/release/*; do
            name=$(basename "$f")
            case "$name" in
              *-repodata)
                arch="${name%-repodata}"
                grep -vx "${arch}-repodata" /tmp/simulated-assets.txt > /tmp/sim.tmp || true
                mv /tmp/sim.tmp /tmp/simulated-assets.txt
                ;;
            esac
            echo "$name" >> /tmp/simulated-assets.txt
          done
          sort -u /tmp/simulated-assets.txt -o /tmp/simulated-assets.txt

          grep -E '\.xbps$' /tmp/simulated-assets.txt \
            | sed -E 's/^(.+)-[0-9][^-]*_[0-9]+\.(x86_64|aarch64)\.xbps$/\1.\2/' \
            | sort > /tmp/present.txt

          : > /tmp/problems.txt
          sort /tmp/present.txt | uniq -d >> /tmp/problems.txt

          for pkg in $PACKAGES; do
            for arch in $ARCHES; do
              count=$(grep -Fxc "${pkg}.${arch}" /tmp/present.txt)
              if [ "$count" -eq 0 ]; then
                echo "FALTANDO: ${pkg}.${arch}" >> /tmp/problems.txt
              fi
            done
          done

          if [ -s /tmp/problems.txt ]; then
            echo "Simulação encontrou conflitos, abortando antes de tocar na release ao vivo:" >&2
            cat /tmp/problems.txt >&2
            exit 1
          fi
          echo "Simulação ok, nenhum conflito. Prosseguindo."

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Latest build of XBPS packages
          Built on: ${{ steps.timestamp.outputs.value }}"

          if gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit latest --repo "${REPO}" --title "Latest Build" --notes "$NOTES"
          else
            gh release create latest --repo "${REPO}" --title "Latest Build" --notes "$NOTES"
          fi

          if [ -s /tmp/stale-assets.txt ]; then
            while read -r name; do
              gh release delete-asset latest "$name" --repo "${REPO}" --yes || true
            done < /tmp/stale-assets.txt
          fi
          for arch in x86_64 aarch64; do
            gh release delete-asset latest "${arch}-repodata" --repo "${REPO}" --yes 2>/dev/null || true
          done

          for f in ~/release/*; do
            name=$(basename "$f")
            attempt=1
            until gh release upload latest "$f" --repo "${REPO}" --clobber; do
              if [ "$attempt" -ge 5 ]; then
                echo "Falha ao subir ${name} depois de 5 tentativas" >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 15))
            done
          done

      - name: Commit PACKAGES.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update PACKAGES.md
          file_pattern: PACKAGES.md

      - name: Verify release consistency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGES="brave brave-beta brave-nightly brave-origin brave-origin-beta brave-origin-nightly vivaldi vivaldi-snapshot"
          ARCHES="x86_64 aarch64"

          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
            | grep -E '\.xbps$' \
            | sed -E 's/^(.+)-[0-9][^-]*_[0-9]+\.(x86_64|aarch64)\.xbps$/\1.\2/' \
            | sort > /tmp/present.txt

          : > /tmp/problems.txt
          sort /tmp/present.txt | uniq -d >> /tmp/problems.txt

          for pkg in $PACKAGES; do
            for arch in $ARCHES; do
              count=$(grep -Fxc "${pkg}.${arch}" /tmp/present.txt)
              if [ "$count" -eq 0 ]; then
                echo "FALTANDO: ${pkg}.${arch}" >> /tmp/problems.txt
              fi
            done
          done

          if [ -s /tmp/problems.txt ]; then
            echo "Problemas encontrados na release:" >&2
            cat /tmp/problems.txt >&2
            exit 1
          fi
          echo "Release consistente: todos os pacotes presentes, sem duplicatas."
