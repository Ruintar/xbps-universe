name: Build Packages

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild all packages, ignoring what is already published"
        type: boolean
        default: false
  schedule:
    - cron: "30 6,18 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    outputs:
      skip_x86_64: ${{ steps.check.outputs.skip_x86_64 }}
      skip_aarch64: ${{ steps.check.outputs.skip_aarch64 }}
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev
    env:
      ARCH: ${{ matrix.arch }}
      BOOTSTRAP: ${{ matrix.arch }}
      REPO: ${{ github.repository }}
      FORCE_REBUILD: ${{ github.event.inputs.force_rebuild == 'true' && '1' || '0' }}
    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash curl git github-cli
          useradd -G xbuilder -M builder

      - name: Clone void-packages
        run: git clone --depth=1 --branch=master https://github.com/void-linux/void-packages

      - name: Clone xbps-universe
        run: git clone --depth=1 --branch=master "https://github.com/${REPO}" xbps-universe

      - name: Populate srcpkgs
        run: |
          chmod +x xbps-universe/populate-srcpkgs.sh
          VOID_PACKAGES_DIR="void-packages" ./xbps-universe/populate-srcpkgs.sh
          if ls xbps-universe/common/repo-keys/*.plist >/dev/null 2>&1; then
            cp xbps-universe/common/repo-keys/*.plist void-packages/common/repo-keys/
            mkdir -p /var/db/xbps/keys
            cp xbps-universe/common/repo-keys/*.plist /var/db/xbps/keys/
            echo "chaves publicas do xbps-universe importadas para o host e para o masterdir"
          else
            echo "aviso: nenhum plist em xbps-universe/common/repo-keys, o repo ficara sem chave confiada no host"
          fi

      - name: Prepare masterdir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd void-packages
          if gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            sed -i "1i repository=https://github.com/${REPO}/releases/latest/download" etc/xbps.d/repos-remote.conf
          else
            echo "release latest ainda nao existe, seguindo sem repositorio extra"
          fi
          chown -R builder:builder .
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh

      - name: Check for changed packages
        run: |
          chmod +x xbps-universe/changed-packages.sh
          cd void-packages
          sudo -Eu builder env VOID_PACKAGES_DIR="." ARCH="${ARCH}" FORCE_REBUILD="${FORCE_REBUILD}" \
            bash ../xbps-universe/changed-packages.sh \
            "https://github.com/${REPO}/releases/latest/download"

      - name: Reconcile pending packages with real release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
            > /tmp/release-assets.txt 2>/dev/null || : > /tmp/release-assets.txt

          : > /tmp/ghost-pkgs.txt
          while read -r line; do
            if [ -z "$line" ]; then continue; fi
            pkg=$(echo "$line" | sed 's/-[^-]*$//')
            ver=$(echo "$line" | sed "s/^${pkg}-//")
            if ! grep -Fxq "${pkg}-${ver}.${ARCH}.xbps" /tmp/release-assets.txt \
               || ! grep -Fxq "${pkg}-${ver}.${ARCH}.xbps.sig2" /tmp/release-assets.txt; then
              echo "${pkg}: versao ${ver} nao existe como asset real ${ARCH} na release, forcando rebuild"
              echo "$pkg" >> /tmp/ghost-pkgs.txt
            fi
          done < /tmp/new_pkgs

          if [ -s /tmp/ghost-pkgs.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if ! grep -qx "$pkg" /tmp/pkgs-to-build.txt; then
                echo "$pkg" >> /tmp/pkgs-to-build.txt
              fi
            done < /tmp/ghost-pkgs.txt
            echo "pacotes adicionados pela reconciliacao (${ARCH}):"
            cat /tmp/ghost-pkgs.txt
          else
            echo "reconciliacao ok (${ARCH}): todos os templates tem asset real correspondente"
          fi
          echo "fila final de build (${ARCH}):"
          cat /tmp/pkgs-to-build.txt

      - name: Check for pending work
        id: check
        run: |
          : > /tmp/failed-pkgs.txt
          if [ -s /tmp/pkgs-to-build.txt ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "skip_${ARCH}=false" >> "$GITHUB_OUTPUT"
            echo "ha pacotes para buildar nesta execucao (${ARCH}), fluxo completo"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_${ARCH}=true" >> "$GITHUB_OUTPUT"
            echo "nada para buildar nesta execucao (${ARCH}), modo leve (skip)"
          fi

      - name: Build changed packages
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/packages ~/hostdir
          chown -R builder:builder ~/packages ~/hostdir
          cd void-packages
          if [ -s /tmp/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if sudo -Eu builder ./xbps-src -j"$(nproc)" -s -H ~/hostdir pkg "$pkg"; then
                n=$(find ~/hostdir/binpkgs -name "${pkg}-[0-9]*.${ARCH}.xbps" | wc -l)
                if [ "$n" -eq 0 ]; then
                  echo "nenhum binario ${ARCH} encontrado para ${pkg} apos o build"
                  echo "$pkg" >> /tmp/failed-pkgs.txt
                else
                  find ~/hostdir/binpkgs -name "${pkg}-[0-9]*.${ARCH}.xbps" -exec cp {} ~/packages/ \;
                fi
              else
                echo "build falhou: ${pkg}"
                echo "$pkg" >> /tmp/failed-pkgs.txt
              fi
            done < /tmp/pkgs-to-build.txt
          else
            echo "nenhum pacote para buildar nesta execucao"
          fi
          echo "pacotes buildados: $(ls -1 ~/packages/*.${ARCH}.xbps 2>/dev/null | wc -l)"
          echo "pacotes com falha: $(wc -l < /tmp/failed-pkgs.txt)"

      - name: Download currently published packages
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/all_packages
          if ! gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            echo "release latest ainda nao existe, nada a baixar"
            exit 0
          fi
          n=$(gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
            | grep -cE "\.${ARCH}\.xbps$" || true)
          if [ "$n" -eq 0 ]; then
            echo "nenhum asset ${ARCH} publicado ainda"
            exit 0
          fi
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -rf ~/all_packages
            mkdir -p ~/all_packages
            if gh release download latest --repo "${REPO}" --dir ~/all_packages \
              --pattern "*.${ARCH}.xbps" --clobber; then
              ok=1
              break
            fi
            echo "tentativa ${attempt} de download falhou, aguardando"
            sleep $((attempt * 15))
          done
          if [ "$ok" -ne 1 ]; then
            echo "falha ao baixar os assets ja publicados apos 5 tentativas"
            exit 1
          fi
          echo "assets ${ARCH} baixados: $(ls -1 ~/all_packages | wc -l)"

      - name: Merge old and new packages
        if: steps.check.outputs.skip != 'true'
        run: |
          rm -f ~/all_packages/*.sig2
          if [ -s /tmp/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if grep -qx "$pkg" /tmp/failed-pkgs.txt; then
                echo "mantendo assets antigos de ${pkg} (build falhou)"
                continue
              fi
              rm -f ~/all_packages/"${pkg}"-[0-9]*."${ARCH}".xbps
            done < /tmp/pkgs-to-build.txt
          fi
          cp ~/all_packages/*."${ARCH}".xbps ~/packages/ 2>/dev/null || true
          echo "total de pacotes ${ARCH} a indexar: $(ls -1 ~/packages/*."${ARCH}".xbps | wc -l)"

      - name: Regenerate index and sign
        if: steps.check.outputs.skip != 'true'
        env:
          PRIVATE_PEM: ${{ secrets.PRIVATE_PEM }}
          XBPS_PASSPHRASE: ${{ secrets.PRIVATE_PEM_PASSPHRASE }}
        run: |
          if [ -z "${PRIVATE_PEM}" ]; then
            echo "secret PRIVATE_PEM vazio ou ausente"
            exit 1
          fi
          cd ~/packages
          xbps-rindex -a *."${ARCH}".xbps
          temp_key=$(mktemp)
          printf '%s\n' "$PRIVATE_PEM" > "$temp_key"
          chmod 600 "$temp_key"
          xbps-rindex --privkey "$temp_key" --sign --signedby "Ruintar (xbps-universe CI)" .
          xbps-rindex --privkey "$temp_key" --sign-pkg *."${ARCH}".xbps
          rm -f "$temp_key"

      - name: Prepare release assets and pre-flight validation
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/release
          cp ~/packages/"${ARCH}"-repodata ~/release/
          if [ -s /tmp/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if grep -qx "$pkg" /tmp/failed-pkgs.txt; then continue; fi
              if ! ls ~/packages/"${pkg}"-[0-9]*."${ARCH}".xbps >/dev/null 2>&1; then
                echo "binario de ${pkg} (${ARCH}) ausente apos o build, marcando como FAIL para proteger o asset publicado"
                echo "$pkg" >> /tmp/failed-pkgs.txt
                continue
              fi
              cp ~/packages/"${pkg}"-[0-9]*."${ARCH}".xbps ~/release/
              cp ~/packages/"${pkg}"-[0-9]*."${ARCH}".xbps.sig2 ~/release/ 2>/dev/null || true
            done < /tmp/pkgs-to-build.txt
          fi

          (cd ~/release && ls -1) > /tmp/new-assets.txt
          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
            > /tmp/current-assets.txt 2>/dev/null || : > /tmp/current-assets.txt
          cp /tmp/current-assets.txt /tmp/simulated-assets.txt

          if [ -s /tmp/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if grep -qx "$pkg" /tmp/failed-pkgs.txt; then continue; fi
              grep -vE "^${pkg}-[0-9].*\.${ARCH}\.xbps(\.sig2)?$" /tmp/simulated-assets.txt \
                > /tmp/sim-tmp && mv /tmp/sim-tmp /tmp/simulated-assets.txt
            done < /tmp/pkgs-to-build.txt
          fi
          cat /tmp/new-assets.txt >> /tmp/simulated-assets.txt

          sed 's/-[^-]*$//' /tmp/new_pkgs | sort -u > /tmp/pkg-list.txt
          rc=0
          while read -r pkg; do
            if [ -z "$pkg" ]; then continue; fi
            count=$(grep -cE "^${pkg}-[0-9].*\.${ARCH}\.xbps$" /tmp/simulated-assets.txt || true)
            if [ "$count" -gt 1 ]; then
              echo "duplicata prevista para ${pkg} (${ARCH}):"
              grep -E "^${pkg}-[0-9].*\.${ARCH}\.xbps$" /tmp/simulated-assets.txt
              rc=1
            fi
          done < /tmp/pkg-list.txt
          if [ "$rc" -ne 0 ]; then
            echo "pre-voo abortado: haveria mais de uma versao do mesmo pacote/arquitetura na release"
            exit 1
          fi
          echo "pre-voo ok (${ARCH}): nenhuma duplicata prevista"

      - name: Delete stale release assets
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            echo "release latest ainda nao existe, nada a remover"
            exit 0
          fi
          if [ -s /tmp/pkgs-to-build.txt ]; then
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              if grep -qx "$pkg" /tmp/failed-pkgs.txt; then continue; fi
              for name in $(gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' \
                  | grep -E "^${pkg}-[0-9].*\.${ARCH}\.xbps(\.sig2)?$" \
                  | grep -vxF -f /tmp/new-assets.txt); do
                echo "removendo asset obsoleto: ${name}"
                gh release delete-asset latest "$name" --repo "${REPO}" --yes || true
              done
            done < /tmp/pkgs-to-build.txt
          fi
          gh release delete-asset latest "${ARCH}-repodata" --repo "${REPO}" --yes || true

      - name: Generate build manifest
        run: |
          : > ~/manifest-"${ARCH}".txt
          while read -r line; do
            if [ -z "$line" ]; then continue; fi
            pkg=$(echo "$line" | sed 's/-[^-]*$//')
            ver=$(echo "$line" | sed "s/^${pkg}-//")
            if grep -qx "$pkg" /tmp/failed-pkgs.txt; then
              status=FAIL
            else
              status=OK
            fi
            echo "$pkg $ver $status" >> ~/manifest-"${ARCH}".txt
          done < /tmp/new_pkgs
          cat ~/manifest-"${ARCH}".txt

      - name: Upload built packages
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: built-packages-${{ matrix.arch }}
          path: ~/release/
          retention-days: 1

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.arch }}
          path: ~/manifest-${{ matrix.arch }}.txt
          retention-days: 1

  create-github-release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout xbps-universe
        uses: actions/checkout@v4

      - name: Evaluate publish mode
        id: mode
        env:
          SKIP_X86_64: ${{ needs.build.outputs.skip_x86_64 }}
          SKIP_AARCH64: ${{ needs.build.outputs.skip_aarch64 }}
        run: |
          if [ "${SKIP_X86_64}" = "true" ] && [ "${SKIP_AARCH64}" = "true" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "modo leve: nada para publicar nesta execucao"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "modo completo: ha trabalho para publicar"
          fi

      - name: Download built packages
        if: steps.mode.outputs.full == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: built-packages-*
          path: release
          merge-multiple: true

      - name: Download manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true

      - name: Timestamp
        if: steps.mode.outputs.full == 'true'
        id: ts
        run: echo "value=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        if: steps.mode.outputs.full == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Latest build of XBPS packages
          Built on: ${{ steps.ts.outputs.value }}"
          if gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit latest --repo "${REPO}" --title "Latest Build" --notes "$notes"
          else
            gh release create latest --repo "${REPO}" --title "Latest Build" --notes "$notes" --latest
          fi

      - name: Upload release assets
        if: steps.mode.outputs.full == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "nenhum asset para publicar"
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload latest "$f" --repo "${REPO}" --clobber; then
                ok=1
                break
              fi
              echo "falha ao subir ${name} (tentativa ${attempt}), aguardando"
              sleep $((attempt * 15))
            done
            if [ "$ok" -ne 1 ]; then
              echo "falha definitiva ao subir ${name}"
              exit 1
            fi
            echo "asset publicado: ${name}"
          done

      - name: Verify release (post-flight)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls manifests/manifest-*.txt >/dev/null 2>&1 || {
            echo "erro: nenhum manifest encontrado, nao e possivel verificar a release"
            exit 1
          }
          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' | sort > /tmp/assets.txt
          cut -d' ' -f1 manifests/manifest-*.txt | sort -u > /tmp/pkg-list.txt
          if [ ! -s /tmp/pkg-list.txt ]; then
            echo "erro: lista de pacotes vazia, recusando rodar uma verificacao vazia"
            exit 1
          fi
          rc=0
          while read -r pkg; do
            if [ -z "$pkg" ]; then continue; fi
            for arch in x86_64 aarch64; do
              count=$(grep -cE "^${pkg}-[0-9].*\.${arch}\.xbps$" /tmp/assets.txt || true)
              sigcount=$(grep -cE "^${pkg}-[0-9].*\.${arch}\.xbps\.sig2$" /tmp/assets.txt || true)
              if [ "$count" -gt 1 ]; then
                echo "mais de uma versao de ${pkg} (${arch}) coexistindo na release:"
                grep -E "^${pkg}-[0-9].*\.${arch}\.xbps$" /tmp/assets.txt
                rc=1
              elif [ "$count" -eq 0 ]; then
                if grep -h "^${pkg} " manifests/manifest-*.txt | grep -q FAIL; then
                  echo "aviso: ${pkg} (${arch}) ausente, build falhou nesta execucao"
                else
                  echo "erro: ${pkg} (${arch}) ausente da release"
                  rc=1
                fi
              fi
              if [ "$sigcount" -ne "$count" ]; then
                echo "erro: assinaturas divergentes para ${pkg} (${arch}): ${sigcount} sig2 para ${count} pacotes"
                rc=1
              fi
            done
          done < /tmp/pkg-list.txt
          for arch in x86_64 aarch64; do
            if ! grep -qx "${arch}-repodata" /tmp/assets.txt; then
              echo "erro: ${arch}-repodata ausente da release"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "pos-voo falhou: a release ficou em estado inconsistente"
            exit 1
          fi
          echo "pos-voo ok: uma versao por pacote/arquitetura, assinaturas e repodata presentes"

      - name: Generate PACKAGES.md
        run: |
          ls manifests/manifest-*.txt >/dev/null 2>&1 || {
            echo "erro: nenhum manifest encontrado em manifests/"
            exit 1
          }
          cut -d' ' -f1 manifests/manifest-*.txt | sort -u > /tmp/pkg-order.txt
          if [ ! -s /tmp/pkg-order.txt ]; then
            echo "erro: lista de pacotes vazia, recusando gerar um PACKAGES.md vazio"
            exit 1
          fi
          {
            echo "| Package | aarch64 | x86_64 |"
            echo "|---|---|---|"
            while read -r pkg; do
              if [ -z "$pkg" ]; then continue; fi
              cell_aarch64="-"
              if grep -q "^${pkg} " manifests/manifest-aarch64.txt 2>/dev/null; then
                ver=$(grep "^${pkg} " manifests/manifest-aarch64.txt | head -n1 | awk '{ print $2 }')
                if grep "^${pkg} " manifests/manifest-aarch64.txt | awk '{ print $3 }' | grep -qx FAIL; then
                  cell_aarch64="❌ ${ver}"
                else
                  cell_aarch64="✅ ${ver}"
                fi
              fi
              cell_x86_64="-"
              if grep -q "^${pkg} " manifests/manifest-x86_64.txt 2>/dev/null; then
                ver=$(grep "^${pkg} " manifests/manifest-x86_64.txt | head -n1 | awk '{ print $2 }')
                if grep "^${pkg} " manifests/manifest-x86_64.txt | awk '{ print $3 }' | grep -qx FAIL; then
                  cell_x86_64="❌ ${ver}"
                else
                  cell_x86_64="✅ ${ver}"
                fi
              fi
              echo "| ${pkg} | ${cell_aarch64} | ${cell_x86_64} |"
            done < /tmp/pkg-order.txt
          } > PACKAGES.md
          cat PACKAGES.md

      - name: Commit PACKAGES.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update PACKAGES.md"
          file_pattern: PACKAGES.md
